<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007bff'/%3E%3Cpath d='M9 12h14M9 16h10M9 20h7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#007bff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>SupportChat</title>
    <script>
      // Anti-flash: apply the stored color scheme before the bundle loads, so a
      // dark-mode user never sees a light frame. Mirrors MUI's ThemeProvider
      // (modeStorageKey 'sc_theme_mode', attribute data-mui-color-scheme).
      (function () {
        try {
          var mode = localStorage.getItem('sc_theme_mode') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var scheme = dark ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-mui-color-scheme', scheme);
          root.style.colorScheme = scheme;
          root.style.backgroundColor = dark ? '#0f172a' : '#f5f7f9';
        } catch (e) {
          /* localStorage unavailable — MUI falls back to the system scheme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
