# Production stack: Caddy (TLS) -> app (API + WS + SPA) -> postgres.
# Run with an env file:
#   docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d --build
#
# Only 80/443 are published; Postgres and the app port stay inside the internal network.

services:
  postgres:
    image: postgres:16
    container_name: support-chat-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: support-chat-app:latest
    container_name: support-chat-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      TELEGRAM_TOKEN_KEY: ${TELEGRAM_TOKEN_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Двухдоменная схема: DOMAIN — лендинг + виджет, APP_DOMAIN — панели.
      # Пока APP_DOMAIN пуст, бэкенд ведёт себя как раньше (всё на одном домене).
      DOMAIN: ${DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN:-}
      CHAT_TIMEOUT_MINUTES: ${CHAT_TIMEOUT_MINUTES:-7}
      # SEC-08: general API requests allowed per IP per 15 min (default 1000).
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-1000}
      # First-run seed (idempotent). Set RUN_SEED=true for the first boot only.
      RUN_SEED: ${RUN_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # SEC-04: only needed for the very first seed. Remove from deploy/.env after
      # the superadmin exists — the running app never needs it again.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      TENANT_SLUG: ${TENANT_SLUG:-default}
      TENANT_NAME: ${TENANT_NAME:-Главный офис}
      TENANT_ADMIN_EMAIL: ${TENANT_ADMIN_EMAIL:-}
      TENANT_ADMIN_PASSWORD: ${TENANT_ADMIN_PASSWORD:-}
      # Billing: Crypto Pay API (CryptoBot) token. When empty, online payment is
      # disabled and the owner confirms payments manually from the CRM.
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      CRYPTOBOT_API_BASE: ${CRYPTOBOT_API_BASE:-https://pay.crypt.bot/api}
      # "fiat" (amount in CRYPTOBOT_FIAT, default USD) or "crypto" (CRYPTOBOT_ASSET).
      CRYPTOBOT_CURRENCY_TYPE: ${CRYPTOBOT_CURRENCY_TYPE:-fiat}
      CRYPTOBOT_FIAT: ${CRYPTOBOT_FIAT:-USD}
      CRYPTOBOT_ASSET: ${CRYPTOBOT_ASSET:-USDT}
      # Monitoring: protects GET /status (used by deploy/monitor.sh + owner CRM).
      # Leave empty to disable the endpoint entirely (503).
      STATUS_TOKEN: ${STATUS_TOKEN:-}
      # Warning thresholds used by the /status payload (percent).
      MONITOR_DISK_WARN: ${MONITOR_DISK_WARN:-85}
      MONITOR_MEM_WARN: ${MONITOR_MEM_WARN:-90}
    volumes:
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  caddy:
    image: caddy:2
    container_name: support-chat-caddy
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Панели живут на отдельном домене — Caddy выпускает для него свой сертификат.
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
